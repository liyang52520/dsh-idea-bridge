name: Release

# 推送 v* tag 时：跑测试 + buildPlugin → 建 GitHub Release（附 zip）→ 把
# updatePlugins.xml（IDEA 自定义插件仓库索引）和 zip 一起发布到 GitHub Pages。
#
# IDEA 里填的仓库 URL（Pages，Fastly；本机实测 raw.githubusercontent.com 被 reset、
# github.com HTTPS 也常超时，而 github.io 可达）：
#   https://liyang52520.github.io/dsh-idea-bridge/updatePlugins.xml
# 备用：仓库根的 updatePlugins.xml（raw 可达时）与 Release 资产（手动下载）。
#
# 用法：
#   1. 改 idea-plugin/build.gradle.kts 里的 version（例如 2.1.4）
#   2. git commit && git push
#   3. git tag v2.1.4 && git push origin v2.1.4
# tag 与 build.gradle.kts 的 version 不一致时本工作流直接失败，避免发出错误的索引。
#
# workflow_dispatch：为已存在的 tag 重跑发布（例如 Release/资产丢了），填 tag 即可：
#   gh workflow run release.yml -f tag=v2.1.4
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to (re)publish, e.g. v2.1.4"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # push 时是触发的 tag；workflow_dispatch 时是输入的 tag
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          # 提交索引回 main 需要完整历史与可写的 token
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          BUILD_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' idea-plugin/build.gradle.kts)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build-version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          if [ -z "$BUILD_VERSION" ]; then
            echo "::error::Cannot read the version from idea-plugin/build.gradle.kts"
            exit 1
          fi
          if [ "$VERSION" != "$BUILD_VERSION" ]; then
            echo "::error::Tag $TAG does not match idea-plugin/build.gradle.kts version $BUILD_VERSION. Bump the version, commit, and re-tag."
            exit 1
          fi

      - name: Test and build plugin
        working-directory: idea-plugin
        # 不传 -PlocalIdePath：CI 上没有本地 IDE，走 build.gradle.kts 的
        # intellijIdeaCommunity($platformVersion)（默认 2024.1.7，与本插件 since-build 241 一致）。
        run: ./gradlew test buildPlugin --console=plain --stacktrace

      - name: Locate distribution
        id: dist
        run: |
          ZIP="$(find idea-plugin/build/distributions -maxdepth 1 -name '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "::error::buildPlugin produced no zip under idea-plugin/build/distributions"
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "asset=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.dist.outputs.zip }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # 重跑工作流时保持幂等（gh release edit 没有 --generate-notes，notes 保持原样）
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --title "DeepSeek Harness Bridge $VERSION"
          else
            gh release create "$TAG" "$ZIP#DeepSeek Harness Bridge $VERSION" \
              --title "DeepSeek Harness Bridge $VERSION" \
              --generate-notes
          fi

      - name: Publish plugin index and distribution (GitHub Pages)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.dist.outputs.asset }}
          ZIP: ${{ steps.dist.outputs.zip }}
        run: |
          # 索引和 zip 都发布到 GitHub Pages（*.github.io 走 Fastly）：
          #   https://<owner>.github.io/<repo>/updatePlugins.xml
          #   https://<owner>.github.io/<repo>/downloads/<asset>.zip
          # 原因：本机实测 raw.githubusercontent.com 被连接重置，github.com HTTPS 也常超时；
          # github.io（Fastly）可达，因此 IDEA 的更新检查走 Pages。
          # 同时保留仓库根 updatePlugins.xml（raw 可达时的备用）和 Release 资产（手动下载）。
          PAGES_BASE="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"

          git fetch origin main
          git checkout -B main origin/main

          # Pages 站点根在 main 的 docs/；只保留当前版本的 zip，避免仓库无限膨胀
          mkdir -p docs/downloads
          rm -f docs/downloads/*.zip
          cp "$ZIP" "docs/downloads/${ASSET}"

          cat > docs/updatePlugins.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
            <plugin id="com.yg.dsh.idea"
                    url="${PAGES_BASE}/downloads/${ASSET}"
                    version="${VERSION}">
              <idea-version since-build="241"/>
              <name>DeepSeek Harness Bridge</name>
              <vendor>YG</vendor>
              <depends>com.intellij.modules.platform</depends>
              <description>Send the code you selected in IntelliJ IDEA to the DeepSeek Harness window you already have open, as @/path/File.kt#L10-20 references.</description>
              <change-notes>Release notes: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}</change-notes>
            </plugin>
          </plugins>
          EOF
          cp docs/updatePlugins.xml updatePlugins.xml

          # Release 上也挂一份 zip 与索引，便于手动下载 / 备用
          gh release upload "$TAG" "$ZIP" updatePlugins.xml --clobber

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/updatePlugins.xml docs/downloads updatePlugins.xml
          if git diff --cached --quiet; then
            echo "index/distribution already up to date for ${TAG}"
            exit 0
          fi
          git commit -m "chore: publish ${TAG} plugin index and distribution"
          git push origin main